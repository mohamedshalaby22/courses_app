name: courses_app
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  hugeicons: ^1.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app-icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7E57C2"
  adaptive_icon_foreground: "assets/app-icon.png"   

flutter:
  uses-material-design: true
  assets:
    - assets/ 

 
  fonts:
    # tajawal font
    - family: tajawal
      fonts:
        - asset: fonts/Tajawal/Tajawal-Bold.ttf
        - asset: fonts/Tajawal/Tajawal-ExtraBold.ttf
        - asset: fonts/Tajawal/Tajawal-ExtraLight.ttf
        - asset: fonts/Tajawal/Tajawal-Light.ttf
        - asset: fonts/Tajawal/Tajawal-Medium.ttf
        - asset: fonts/Tajawal/Tajawal-Regular.ttf

     # elmessiri font
    - family: elmessiri
      fonts:
        - asset: fonts/El_Messiri/ElMessiri-Bold.ttf
        - asset: fonts/El_Messiri/ElMessiri-Medium.ttf
        - asset: fonts/El_Messiri/ElMessiri-Regular.ttf
        - asset: fonts/El_Messiri/ElMessiri-SemiBold.ttf
   
flutter_assets:
  assets_path:
    - assets/
  output_path: lib/core/constants/
  filename: app_images.dart
  field_prefix: null
